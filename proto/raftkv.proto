syntax = "proto3";
package raftkv;

// ---------------------------------------------------------------- Raft RPCs

message Entry {
  uint64 term = 1;
  uint64 index = 2;
  bytes data = 3; // empty = leader no-op
}

message VoteRequest {
  uint64 term = 1;
  uint64 candidate = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}
message VoteReply {
  uint64 term = 1;
  bool granted = 2;
}

message AppendRequest {
  uint64 term = 1;
  uint64 leader = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
}
message AppendReply {
  uint64 term = 1;
  bool success = 2;
  // On failure: the index the leader should try next.
  uint64 conflict_index = 3;
}

message SnapshotRequest {
  uint64 term = 1;
  uint64 leader = 2;
  uint64 last_index = 3;
  uint64 last_term = 4;
  bytes data = 5;
}
message SnapshotReply {
  uint64 term = 1;
}

service Raft {
  rpc RequestVote(VoteRequest) returns (VoteReply);
  rpc AppendEntries(AppendRequest) returns (AppendReply);
  rpc InstallSnapshot(SnapshotRequest) returns (SnapshotReply);
}

// ---------------------------------------------------------------- On disk

// One WAL record: the hard state at the time of writing plus any new entries.
// On replay, an entry at index i replaces everything from i onwards.
message WalRecord {
  uint64 term = 1;
  uint64 vote = 2;
  repeated Entry entries = 3;
}

message SnapshotFile {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

// ---------------------------------------------------------------- KV

enum Op {
  GET = 0;
  PUT = 1;
  APPEND = 2;
}

// A client request. Also the payload of a log entry.
message Command {
  uint64 client_id = 1;
  uint64 seq = 2;
  Op op = 3;
  string key = 4;
  bytes value = 5;
}

message KvReply {
  bool ok = 1;
  bytes value = 2;      // Get result ("" if missing)
  uint64 leader = 3;    // when !ok: who we think the leader is (0 = unknown)
}

message Session {
  uint64 seq = 1;
  bytes value = 2;
}

message KvSnapshot {
  map<string, bytes> data = 1;
  map<uint64, Session> sessions = 2;
}

service Kv {
  rpc Execute(Command) returns (KvReply);
}
